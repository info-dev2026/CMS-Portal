services:
  - type: web
    name: charger-portal-backend
    env: node
    region: oregon     # or any region you prefer
    buildCommand: npm install
    startCommand: npm run dev   # runs `node server.js`
    # The following env vars will be injected at runtime.
    envVars:
      - key: DATABASE_URL
        fromDatabase: cms_backend_2yl9   # <‑‑ Render will create a PostgreSQL service with this name (see step 2)
      - key: API_SECRET
        sync: false   # set the value in the Render dashboard (never commit secrets)
      - key: VERCEL_DASHBOARD_URL
        value: https://cms-portal-lyart.vercel.app
    autoDeploy: true
